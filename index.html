<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Poder Adquisitivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- ESTILOS PARA PC (VOLVEMOS AL ORIGINAL) --- */
        @media (min-width: 769px) {
            .container-main { max-width: 1100px; margin: 40px auto; }
            .desktop-table-view { display: block; }
            .mobile-dashboard-view { display: none; }
            table { width: 100%; border-collapse: collapse; }
            th { background-color: #1e293b; color: white; padding: 12px; font-size: 10px; text-transform: uppercase; }
            td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; }
            .text-left-pc { text-align: left; }
        }

        /* --- ESTILOS PARA MÓVIL (DASHBOARD) --- */
        @media (max-width: 768px) {
            .desktop-table-view { display: none; }
            .mobile-dashboard-view { display: block; }
            .show-table-mobile .desktop-table-view { display: block !important; }
            
            /* Ajuste de tabla para que no se rompa en móvil si se activa */
            .desktop-table-view table, .desktop-table-view tbody, .desktop-table-view tr, .desktop-table-view td {
                display: block; width: 100%;
            }
            .desktop-table-view tr { border: 1px solid #ddd; margin-bottom: 10px; border-radius: 8px; }
            .desktop-table-view td { display: flex; justify-content: space-between; border: none; padding: 8px 15px; }
            .desktop-table-view td::before { content: attr(data-label); font-weight: bold; font-size: 10px; color: #666; }
            .desktop-table-view thead { display: none; }
        }

        .sticky-result-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .bg-loss { background: #dc2626; color: white; }
        .bg-gain { background: #16a34a; color: white; }
    </style>
</head>
<body class="bg-slate-100 pb-32">

    <div class="container-main bg-white shadow-xl md:rounded-xl border-t-8 border-blue-900 overflow-hidden">
        
        <div class="bg-blue-900 p-6 text-white text-center">
            <h1 class="text-2xl font-black italic uppercase">¿Cuanto Perdimos?</h1>
        </div>

        <div class="p-4 md:p-8">
            <div class="bg-slate-50 p-5 rounded-lg border mb-8">
                <label class="block text-xs font-bold uppercase mb-2">Sueldo de referencia:</label>
                <select id="presetIncome" class="w-full p-3 border rounded font-bold mb-4" onchange="updateIncome()">
                    <option value="custom">CARGA MANUAL</option>
                    <option value="smvm">Salario Mínimo (SMVM)</option>
                    <option value="jubilacion">Jubilación Mínima</option>
                    <option value="municipal">Mínimo Garantizado Municipal</option>
                    <option value="comercio">Salario Comercio</option>
                    <option value="docente">Salario Docente</option>
                </select>
                <div id="manualInputs" class="grid grid-cols-2 gap-4">
                    <input type="text" id="inc2023" placeholder="Sueldo Nov 2023" class="p-3 border rounded text-center font-bold" oninput="runAllCalculations()">
                    <input type="text" id="incHoy" placeholder="Sueldo Hoy" class="p-3 border rounded text-center font-bold" oninput="runAllCalculations()">
                </div>
            </div>

            <div class="mobile-dashboard-view">
                <div class="grid grid-cols-1 gap-4 mb-6">
                    <button onclick="activateSourceMobile('ipec')" class="p-5 bg-white border-2 border-blue-900 rounded-xl text-left">
                        <span class="text-[10px] font-bold text-blue-900 uppercase">Canasta IPEC</span>
                        <div id="dash-res-ipec" class="text-3xl font-black text-red-600">--%</div>
                        <span class="text-[9px] text-slate-400 font-bold uppercase">Tocar para ver detalle ↓</span>
                    </button>
                    <button onclick="activateSourceMobile('alvear')" class="p-5 bg-white border-2 border-orange-500 rounded-xl text-left">
                        <span class="text-[10px] font-bold text-orange-600 uppercase">Canasta ALVEAR</span>
                        <div id="dash-res-alvear" class="text-3xl font-black text-red-600">--%</div>
                        <span class="text-[9px] text-slate-400 font-bold uppercase">Tocar para ver detalle ↓</span>
                    </button>
                    <button onclick="activateSourceMobile('coto')" class="p-5 bg-white border-2 border-red-600 rounded-xl text-left">
                        <span class="text-[10px] font-bold text-red-600 uppercase">Canasta COTO</span>
                        <div id="dash-res-coto" class="text-3xl font-black text-red-600">--%</div>
                        <span class="text-[9px] text-slate-400 font-bold uppercase">Tocar para ver detalle ↓</span>
                    </button>
                </div>
            </div>

            <div id="mainTableSection" class="desktop-table-view">
                <div class="hidden md:flex justify-between items-center mb-4">
                    <select id="priceSource" class="p-2 border-2 border-blue-900 rounded font-bold text-blue-900" onchange="renderTable()">
                        <option value="ipec">Fuente: IPEC (48 art.)</option>
                        <option value="alvear">Fuente: ALVEAR (27 art.)</option>
                        <option value="coto">Fuente: COTO (23 art.)</option>
                    </select>
                    <button onclick="toggleAll(true)" class="text-[10px] font-bold uppercase text-blue-900">Seleccionar todos</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Elegir</th>
                            <th class="text-left-pc">Producto</th>
                            <th>En 2023 comprabas</th>
                            <th>Hoy comprás</th>
                            <th>Variación</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="stickyBar" class="sticky-result-bar hidden">
        <div class="text-xs font-black uppercase italic" id="barLabel">Pérdida de poder adquisitivo</div>
        <div id="barPercent" class="text-4xl font-black italic">0%</div>
    </div>

    <script>
        const dataIPEC = [{cat:"Gral",items:[{name:"Pan francés mignón (Kg.)",p23:913.97,pH:3066.99},{name:"Pan de mesa (390 g.)",p23:891.44,pH:3993.77},{name:"Galletitas dulces (150 g.)",p23:420.35,pH:1464.71},{name:"Galletitas de agua (250 g.)",p23:446.46,pH:1415.21},{name:"Harina de trigo común (Kg.)",p23:402.46,pH:951.40},{name:"Arroz blanco simple (Kg.)",p23:1068.42,pH:1858.11},{name:"Fideos Secos Guisero (500 g.)",p23:642.99,pH:1471.06},{name:"Asado (Kg.)",p23:4116.28,pH:22305.00},{name:"Carne picada especial (Kg.)",p23:3674.89,pH:17076.20},{name:"Paleta (Kg.)",p23:3759.50,pH:19063.86},{name:"Cuadril (Kg.)",p23:4526.12,pH:22569.99},{name:"Nalga (Kg.)",p23:4429.40,pH:22524.60},{name:"Hígado (Kg.)",p23:1097.16,pH:5542.88},{name:"Hamburguesas (4 u.)",p23:1609.24,pH:6702.00},{name:"Pollo entero (Kg.)",p23:1417.83,pH:5279.56},{name:"Filet de merluza fresco (Kg.)",p23:2994.08,pH:12684.06},{name:"Salchicha tipo viena (6 u.)",p23:690.01,pH:2562.66},{name:"Jamón cocido (Kg.)",p23:5763.80,pH:18956.52},{name:"Salchichón (Kg.)",p23:3531.42,pH:11963.98},{name:"Salame (Kg.)",p23:6402.78,pH:23098.17},{name:"Aceite de girasol (1,5 L.)",p23:1495.50,pH:6541.07},{name:"Leche fresca sachet (L.)",p23:560.48,pH:1811.38},{name:"Leche en polvo (800 g.)",p23:3513.07,pH:12855.28},{name:"Queso crema (280 g.)",p23:1213.22,pH:4015.38},{name:"Queso Sardo (Kg.)",p23:4982.96,pH:21766.92},{name:"Manteca (150 g.)",p23:792.13,pH:3048.66},{name:"Yogur firme (195 cc.)",p23:430.21,pH:1780.65},{name:"Dulce de leche (450 g.)",p23:1039.08,pH:3571.45},{name:"Huevos de gallina (12 u.)",p23:1196.71,pH:3599.42},{name:"Azúcar (Kg.)",p23:1083.62,pH:1435.80},{name:"Yerba mate (500 g.)",p23:1181.03,pH:2359.58},{name:"Café molido (500 g.)",p23:2740.36,pH:12325.65},{name:"Manzana deliciosa (Kg.)",p23:1084.17,pH:4315.55},{name:"Naranja (Kg.)",p23:562.89,pH:2070.54},{name:"Banana (Kg.)",p23:1281.06,pH:3015.44},{name:"Papa (Kg.)",p23:579.67,pH:1232.51},{name:"Cebolla (Kg.)",p23:358.53,pH:1011.09},{name:"Lechuga (Kg.)",p23:725.25,pH:4427.59},{name:"Tomate redondo (Kg.)",p23:1387.50,pH:2419.70},{name:"Tomate en conserva (lata)",p23:418.04,pH:1301.98},{name:"Lentejas secas (400 g.)",p23:813.91,pH:1727.29},{name:"Sal fina (500 g.)",p23:318.53,pH:1355.67},{name:"Gaseosa cola (1,5 L.)",p23:955.46,pH:3807.16},{name:"Agua sin Gas (1,5 L.)",p23:379.88,pH:1899.67},{name:"Soda sifón (2 L.)",p23:551.25,pH:1590.26},{name:"Cerveza en botella (L.)",p23:1100.56,pH:3794.73},{name:"Cerveza en lata (350 cc.)",p23:505.06,pH:1589.57},{name:"Vino común (L.)",p23:1094.44,pH:2409.64}]}];
        const dataAlvear = [{cat:"Gral",items:[{name:"Toalla femenina x8",p23:299,pH:3029},{name:"Rack de ternera",p23:3949,pH:30990},{name:"Limpiador Cif",p23:559,pH:3990},{name:"Yogur Tregar",p23:389,pH:2659},{name:"Corte Malvinas",p23:3999,pH:25490},{name:"Nalga ternera",p23:4290,pH:26990},{name:"Marucha ternera",p23:3149,pH:18490},{name:"Lavavajilla Cif",p23:455,pH:2639},{name:"Tomahawk ternera",p23:3780,pH:21490},{name:"Skip Líquido 500cc",p23:2159,pH:11999},{name:"Crema La Paulina",p23:535,pH:2899},{name:"Manteca tonadita",p23:599,pH:3199},{name:"Ayudín 2L",p23:679,pH:3499},{name:"Cabeza de lomo",p23:3890,pH:19990},{name:"Queso Cremón",p23:2790,pH:13999},{name:"Chorizo Parrillero",p23:2790,pH:13490},{name:"Picada ternera",p23:2699,pH:12990},{name:"Papel Felpita",p23:198,pH:949},{name:"Pollo Las Camelias",p23:1299,pH:6199},{name:"Harina Pureza",p23:495,pH:1990},{name:"Giacomo cappelletini",p23:1529,pH:5799},{name:"Pechito Cerdo 1K",p23:2549,pH:9490},{name:"Filet de pollo",p23:2780,pH:9990},{name:"Pata muslo c/piel",p23:1499,pH:4849},{name:"Rollo cocina",p23:934,pH:2599},{name:"Mate cocido Unión",p23:944,pH:2599},{name:"Mayonesa Hellmans",p23:423,pH:4999}]}];
        const dataCoto = [{cat:"Gral",items:[{name:"Cuadril novillito 1K",p23:3099,pH:17699},{name:"Queso cremoso",p23:2099,pH:10999},{name:"Leche Tres Niñas",p23:479,pH:1890},{name:"Chuleta de Jamón",p23:1399,pH:6200},{name:"Jardinera 3 Legumbres",p23:365.9,pH:896.35},{name:"Chuleta de Paleta",p23:1399.9,pH:4800},{name:"Pata Muslo c/piel",p23:999.9,pH:3999},{name:"Manteca 1er Premio",p23:649.9,pH:3400},{name:"Crema Serenísima",p23:719.9,pH:4705},{name:"Mortadela 300g",p23:939,pH:3759},{name:"Fiambre cerdo Campo",p23:3440,pH:9799},{name:"Jamón Lario kg",p23:4669,pH:21935},{name:"Salamín La Chacra",p23:6475,pH:33999},{name:"Queso provoleta",p23:3799,pH:21499},{name:"Queso pategras kg",p23:3399,pH:19999},{name:"Queso Reggianito",p23:3999,pH:23999},{name:"Queso Tybo",p23:2899,pH:17699},{name:"Tostadas Riera",p23:654.9,pH:1857},{name:"Salsa pizza Knorr",p23:172.9,pH:1499},{name:"Salsa pomarola Knorr",p23:228.9,pH:1499},{name:"Heineken s/alc",p23:424,pH:1500},{name:"Skip Bio 800g",p23:769.99,pH:4420.99},{name:"Papel Felpita 80m",p23:1299.99,pH:4295.87}]}];

        const presets = {
            smvm: { v23: "156.000", vH: "363.000" },
            jubilacion: { v23: "160.713", vH: "463.174" },
            municipal: { v23: "246.008", vH: "1.065.000" },
            comercio: { v23: "332.959,88", vH: "1.095.562,81" },
            docente: { v23: "269.522", vH: "1.037.205" }
        };

        function getVal(id) {
            let s = document.getElementById(id).value;
            return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
        }

        function updateIncome() {
            const s = document.getElementById('presetIncome').value;
            if(s !== "custom") {
                document.getElementById('inc2023').value = presets[s].v23;
                document.getElementById('incHoy').value = presets[s].vH;
            }
            runAllCalculations();
        }

        function activateSourceMobile(src) {
            document.getElementById('priceSource').value = src;
            document.querySelector('.container-main').classList.add('show-table-mobile');
            renderTable();
        }

        function renderTable() {
            const src = document.getElementById('priceSource').value;
            const data = src === 'alvear' ? dataAlvear : (src === 'coto' ? dataCoto : dataIPEC);
            const body = document.getElementById('tableBody');
            body.innerHTML = "";
            data[0].items.forEach(p => {
                body.innerHTML += `
                    <tr>
                        <td data-label="Elegir"><input type="checkbox" class="p-check w-5 h-5" checked data-p23="${p.p23}" data-ph="${p.pH}" onchange="runAllCalculations()"></td>
                        <td class="text-left-pc font-bold" data-label="Producto">${p.name}</td>
                        <td data-label="En 2023" class="res-u23">-</td>
                        <td data-label="Hoy" class="res-uh">-</td>
                        <td data-label="Variación" class="res-v font-black text-lg">-</td>
                    </tr>`;
            });
            runAllCalculations();
        }

        function runAllCalculations() {
            const i23 = getVal('inc2023');
            const iH = getVal('incHoy');

            // 1. Calculamos Dashboard Móvil (Promedios fijos de canasta completa)
            ['ipec', 'alvear', 'coto'].forEach(s => {
                const data = s === 'ipec' ? dataIPEC : (s === 'alvear' ? dataAlvear : dataCoto);
                let s23 = 0, sH = 0;
                data[0].items.forEach(p => { s23 += p.p23; sH += p.pH; });
                const res = (((iH/sH)/(i23/s23))-1)*100;
                const el = document.getElementById(`dash-res-${s}`);
                if(i23 > 0 && iH > 0) {
                    el.innerText = (res > 0 ? "+" : "") + res.toFixed(1) + "%";
                    el.className = `text-3xl font-black ${res < 0 ? 'text-red-600' : 'text-green-600'}`;
                }
            });

            // 2. Calculamos Tabla Detallada
            const rows = document.querySelectorAll('#tableBody tr');
            let t23 = 0, tH = 0, count = 0;
            rows.forEach(r => {
                const cb = r.querySelector('.p-check');
                if(cb.checked && i23 > 0 && iH > 0) {
                    const p23 = parseFloat(cb.dataset.p23);
                    const ph = parseFloat(cb.dataset.ph);
                    const u23 = i23 / p23; const uh = iH / ph;
                    const v = ((uh/u23)-1)*100;
                    r.querySelector('.res-u23').innerText = u23.toFixed(1);
                    r.querySelector('.res-uh').innerText = uh.toFixed(1);
                    const rv = r.querySelector('.res-v');
                    rv.innerText = (v>0?"+":"")+v.toFixed(1)+"%";
                    rv.className = `res-v font-black text-lg ${v < 0 ? 'text-red-600' : 'text-green-600'}`;
                    t23 += p23; tH += ph; count++;
                }
            });

            // 3. Barra fija
            const bar = document.getElementById('stickyBar');
            if(count > 0) {
                const total = (((iH/tH)/(i23/t23))-1)*100;
                bar.classList.remove('hidden');
                document.getElementById('barPercent').innerText = (total>0?"+":"")+total.toFixed(1)+"%";
                bar.className = `sticky-result-bar ${total < 0 ? 'bg-loss' : 'bg-gain'}`;
                document.getElementById('barLabel').innerText = total < 0 ? "Pérdida de poder adquisitivo" : "Mejora de poder adquisitivo";
            } else { bar.classList.add('hidden'); }
        }

        function toggleAll(v) {
            document.querySelectorAll('.p-check').forEach(c => c.checked = v);
            runAllCalculations();
        }

        renderTable();
        updateIncome();
    </script>
</body>
</html>
