<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad | Variación de Precios</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --comunidad-violeta: #3D1488; --comunidad-fucsia: #EF3C6B; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--comunidad-violeta); }
        
        /* Contenedor Maestra 1200px intacto */
        .container-main { width: 100%; max-width: 1200px; margin: 0 auto; background: white; min-height: 100vh; border-top: 10px solid var(--comunidad-fucsia); }
        @media (min-width: 769px) {
            .container-main { margin: 40px auto; border-radius: 1rem; min-height: 800px; }
            .panel-control { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
            .tabs-container { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
            .tab-btn { padding: 10px 15px; border-radius: 8px; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; transition: all 0.2s; border: 2px solid transparent; display: flex; align-items: center; gap: 6px; background: #f8fafc; color: #64748b; }
            .tab-btn.active { background: var(--comunidad-violeta) !important; color: white !important; border-color: var(--comunidad-fucsia) !important; }
        }

        .header-institucional { background-color: var(--comunidad-violeta); padding: 30px; text-align: center; border-bottom: 4px solid var(--comunidad-fucsia); }
        .logo-comunidad { max-width: 120px; margin: 0 auto 15px; border-radius: 12px; }

        /* Estética de tabla y botones corregida */
        .bg-loss { background: #dc2626; color: white; }
        .bg-gain { background: #16a34a; color: white; }
        .sticky-result-bar { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); transition: background 0.3s ease; }
        input[readonly] { background-color: #f1f5f9; cursor: not-allowed; color: transparent !important; text-shadow: 0 0 0 #64748b; }

        /* Sección de Informes */
        .informes-footer { max-width: 1200px; margin: 40px auto 60px; padding: 0 20px; }
        .informes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .informe-card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .pdf-viewer { width: 100%; height: 180px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .btn-pdf-dl { display: block; background: var(--comunidad-fucsia); color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; }
    </style>
</head>
<body class="pb-40">

    <div class="container-main shadow-2xl md:rounded-2xl overflow-hidden">
        <header class="header-institucional">
            <img src="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/logo.jpg" alt="Comunidad" class="logo-comunidad">
            <h1 class="text-white text-2xl font-black uppercase italic">¿Cuánto aumentaron los alimentos?</h1>
        </header>

        <div class="p-4 md:p-10">
            <div class="panel-control mb-8 p-6 bg-slate-50 rounded-xl border border-slate-200">
                <div class="border-b md:border-b-0 md:border-r border-slate-300 pb-6 md:pb-0 md:pr-10">
                    <h2 class="text-xs font-black text-[#3D1488] uppercase mb-2 tracking-widest italic">1. Ingreso de referencia</h2>
                    <select id="presetIncome" class="w-full p-3 bg-white border-2 border-slate-300 rounded-lg font-bold mb-1" onchange="handlePresetChange()"><option value="custom">CARGA MANUAL</option><option value="smvm">Salario Mínimo (SMVM)</option><option value="jubilacion">Jubilación Mínima</option><option value="municipal">Mínimo Garantizado Municipal</option><option value="comercio">Salario Comercio</option><option value="docente">Salario Docente</option></select>
                    <div id="incomeNote" class="text-[9px] font-black inline-block bg-blue-50 text-blue-800 px-2 py-1 rounded uppercase mb-4 h-6 italic leading-none flex items-center opacity-0 transition-opacity duration-300"></div>
                    <div class="grid grid-cols-2 gap-4"><input type="text" id="inc2023" placeholder="$ 2023" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="formatAndCalc(this)"><input type="text" id="incHoy" placeholder="$ Hoy" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="formatAndCalc(this)"></div>
                </div>
                <div class="pt-6 md:pt-0 md:pl-10">
                    <h2 class="text-xs font-black text-[#3D1488] uppercase tracking-widest italic mb-4">2. Elegir Productos</h2>
                    <div class="space-y-3" id="mainSources">
                        <div id="container-ipec"><button onclick="activateSource('ipec')" id="btn-ipec" class="w-full p-4 bg-white border-2 border-slate-200 rounded-xl flex justify-between items-center transition hover:shadow-md"><span class="flex items-center gap-2"><span id="check-ipec" class="hidden source-active-badge">✓</span><span class="text-[11px] font-black text-slate-600 uppercase italic text-left leading-tight">Canasta IPEC<br><small class="opacity-60">48 productos</small></span></span><span id="dash-ipec" class="text-xl font-black text-slate-400">--%</span></button></div>
                        <div id="container-alvear"><button onclick="activateSource('alvear')" id="btn-alvear" class="w-full p-4 bg-white border-2 border-slate-200 rounded-xl flex justify-between items-center transition hover:shadow-md"><span class="flex items-center gap-2"><span id="check-alvear" class="hidden source-active-badge">✓</span><span class="text-[11px] font-black text-slate-600 uppercase italic text-left leading-tight">Productos ALVEAR<br><small class="opacity-60">43 productos</small></span></span><span id="dash-alvear" class="text-xl font-black text-slate-400">--%</span></button></div>
                    </div>
                </div>
            </div>
            <div id="pcTabs" class="tabs-container hidden md:flex"></div>
            <div id="productsView" class="hidden"><div id="dynamicContent"></div></div>
        </div>
    </div>

    <section class="informes-footer">
        <h3 class="text-white text-center font-black uppercase text-xl italic">¿Cómo calculamos los datos? Leé nuestros informes</h3>
        <div class="informes-grid">
            <div class="informe-card"><strong>Tarifas</strong><iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Tarifas.pdf&embedded=true"></iframe><a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Tarifas.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a></div>
            <div class="informe-card"><strong>Salud</strong><iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Prepagas%20y%20Medicamentos.pdf&embedded=true"></iframe><a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Prepagas%20y%20Medicamentos.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a></div>
            <div class="informe-card"><strong>Alquileres</strong><iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Alquileres%20COMUNIDAD.pdf&embedded=true"></iframe><a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Alquileres%20COMUNIDAD.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a></div>
        </div>
    </section>

    <div id="stickyBar" class="sticky-result-bar hidden">
        <div><div id="barLabel" class="text-[10px] font-black uppercase italic opacity-80">Canasta</div><div id="barStatus" class="text-[10px] font-black uppercase italic">Pérdida</div></div>
        <div id="barPercent" class="text-4xl font-black italic tracking-tighter">0%</div>
    </div>

    <script>
        // TODA TU DATA MAESTRA ESTÁ AQUÍ (IPEC, Alvear, Coto, etc.)
        const dataIPEC = [{cat:"Almacén", items:[{n:"Pan francés mignón (Kg.)",p23:913.97,ph:3066.99},{n:"Pan de mesa (390 g.)",p23:891.44,ph:3993.77},{n:"Galletitas dulces (150 g.)",p23:420.35,ph:1464.71},{n:"Galletitas de agua (250 g.)",p23:446.46,ph:1415.21},{n:"Harina de trigo común (Kg.)",p23:402.46,ph:951.40},{n:"Arroz blanco simple (Kg.)",p23:1068.42,ph:1858.11},{n:"Fideos Secos Guisero (500 g.)",p23:642.99,ph:1471.06},{n:"Aceite de girasol (1,5 L.)",p23:1495.50,ph:6541.07},{n:"Azúcar (Kg.)",p23:1083.62,ph:1435.80},{n:"Yerba mate (500 g.)",p23:1181.03,ph:2359.58},{n:"Café molido (500 g.)",p23:2740.36,ph:12325.65},{n:"Dulce de leche (450 g.)",p23:1039.08,ph:3571.45},{n:"Tomate en conserva (lata)",p23:418.04,ph:1301.98},{n:"Lentejas secas (400 g.)",p23:813.91,ph:1727.29},{n:"Sal fina (500 g.)",p23:318.53,ph:1355.67}]},{cat:"Carnicería", items:[{n:"Asado (Kg.)",p23:4116.28,ph:22305.00},{n:"Carne picada especial (Kg.)",p23:3674.89,ph:17076.20},{n:"Paleta (Kg.)",p23:3759.50,ph:19063.86},{n:"Cuadril (Kg.)",p23:4526.12,ph:22569.99},{n:"Nalga (Kg.)",p23:4429.40,ph:22524.60},{n:"Hígado (Kg.)",p23:1097.16,ph:5542.88},{n:"Hamburguesas (4 u.)",p23:1609.24,ph:6702.00},{n:"Pollo entero (Kg.)",p23:1417.83,ph:5279.56},{n:"Filet de merluza fresco (Kg.)",p23:2994.08,ph:12684.06},{n:"Salchicha tipo viena (6 u.)",p23:690.01,ph:2562.66},{n:"Jamón cocido (Kg.)",p23:5763.80,ph:18956.52},{n:"Salchichón (Kg.)",p23:3531.42,ph:11963.98},{n:"Salame (Kg.)",p23:6402.78,ph:23098.17}]},{cat:"Lácteos", items:[{n:"Leche sachet (L.)",p23:560.48,ph:1811.38},{n:"Leche polvo (800 g.)",p23:3513.07,ph:12855.28},{n:"Queso crema (280 g.)",p23:1213.22,ph:4015.38},{n:"Queso Sardo (Kg.)",p23:4982.96,ph:21766.92},{n:"Manteca (150 g.)",p23:792.13,ph:3048.66},{n:"Yogur firme (195 cc.)",p23:430.21,ph:1780.65},{n:"Huevos (12 u.)",p23:1196.71,ph:3599.42}]},{cat:"Verdulería", items:[{n:"Manzana (Kg.)",p23:1084.17,ph:4315.55},{n:"Naranja (Kg.)",p23:562.89,ph:2070.54},{n:"Banana (Kg.)",p23:1281.06,ph:3015.44},{n:"Papa (Kg.)",p23:579.67,ph:1232.51},{n:"Cebolla (Kg.)",p23:358.53,ph:1011.09},{n:"Lechuga (Kg.)",p23:725.25,ph:4427.59},{n:"Tomate (Kg.)",p23:1387.50,ph:2419.70}]},{cat:"Bebidas", items:[{n:"Gaseosa (1,5 L.)",p23:955.46,ph:3807.16},{n:"Agua sin Gas (1,5 L.)",p23:379.88,ph:1899.67},{n:"Soda sifón (2 L.)",p23:551.25,ph:1590.26},{n:"Cerveza botella (L.)",p23:1100.56,ph:3794.73},{n:"Cerveza lata (350 cc.)",p23:505.06,ph:1589.57},{n:"Vino común (L.)",p23:1094.44,ph:2409.64}]}];
        const dataAlvear = [{cat:"Carnicería", items:[{n:"Rack de ternera",p23:3949,ph:30990},{n:"Corte Malvinas ternera",p23:3890,ph:25490},{n:"Nalga de ternera",p23:4290,ph:26990},{n:"Marucha de ternera",p23:3149,ph:18490},{n:"Tomahawk ternera",p23:4190,ph:21490},{n:"Cabeza de lomo ternera",p23:3890,ph:19990},{n:"Chorizo Parrillero",p23:2670,ph:13490},{n:"Picada ternera",p23:2699,ph:12990},{n:"Pollo Entero Las Camelias",p23:1299,ph:6199},{n:"Pechito de Cerdo 1K",p23:2549,ph:9490},{n:"Filet de pollo",p23:2780,ph:9990},{n:"Pata muslo con piel",p23:1499,ph:4849},{n:"Corte Malvinas Cerdo kg",p23:3999.99,ph:16590},{n:"Milanesa de ternera kg",p23:3999,ph:23490},{n:"Costeleta de cerdo kg",p23:2549.99,ph:6990},{n:"Hamburguesa Parrillera kg",p23:2790,ph:10990},{n:"Bondiola de cerdo",p23:4650,ph:13990},{n:"Marucha de cerdo",p23:2490,ph:7990},{n:"Tapa de Asado ternera kg",p23:4490,ph:18490}]},{cat:"Almacén", items:[{n:"Yogur descremado Tregar 1L",p23:389,ph:2659},{n:"Crema de leche La Paulina 200 gr",p23:899.99,ph:2899},{n:"Manteca tonadita 200 gr",p23:599.99,ph:3199},{n:"Queso cremoso cremón",p23:2790,ph:13999},{n:"Harina Pureza para pizzas",p23:494.99,ph:1990},{n:"Giacomo cappelletini 500 gr",p23:1529,ph:5799},{n:"Mate cocido Unión x50",p23:944,ph:2599},{n:"Mayonesa Hellmans liviana 475 gr",p23:424.99,ph:4999},{n:"Queso untable La Paulina 190 gramos",p23:619.99,ph:2699},{n:"Queso Pategras La Paulina kg",p23:4639.9,ph:27999},{n:"Yerba Mate Primicia",p23:1799.9,ph:13499},{n:"Salchicha 66 x6u",p23:454.99,ph:1699},{n:"Arroz María Largo 1kg",p23:1199.99,ph:1899}]},{cat:"Higiene Personal", items:[{n:"Toallitas femeninas nosotros x8",p23:299,ph:3029},{n:"Protector Nosotras 20u",p23:374.99,ph:1719},{n:"Antitranspirante Rexona 150cc",p23:899.9,ph:15599},{n:"Shampoo Sedal 340cc",p23:722.49,ph:4999},{n:"Toalla Húmeda Q-Soft 40u",p23:1199.99,ph:4699},{n:"Papel Higiénico Felpita Simple 30 mts x6",p23:198,ph:949}]},{cat:"Limpieza", items:[{n:"Limpiador Cif cremoso ultrablanco",p23:559.99,ph:3990},{n:"Lavavajilla Cif",p23:455.99,ph:2639},{n:"Jabón líquido Skip bioenzimas 500cc",p23:2159,ph:11999},{n:"Ayudín lavandina 2L",p23:679.99,ph:3499},{n:"Rollo cocina Felpita x3",p23:934,ph:2599}]},{cat:"Bebidas", items:[{n:"Agua saborizada Levité 1.5L",p23:419.99,ph:2999},{n:"Agua Mineral Nestle 1.5L",p23:199.99,ph:1799},{n:"Gaseosa Pepsi 1.5L",p23:539.99,ph:1999}]}];
        const presets = { smvm:{v23:156000,vh:363000}, jubilacion:{v23:160713,vh:463174}, municipal:{v23:246008,vh:1065000}, comercio:{v23:332959,vh:1023016.21}, docente:{v23:269522,vh:1037205} };

        let selectionMode = false, activeSourceKey = null, activeTabIdx = 0, selections = {}, openAccordions = [], p23_cache = 0, ph_cache = 0;

        function getVal(id) { 
            let val = document.getElementById(id).value;
            if (document.getElementById('presetIncome').value !== 'custom') return id === 'inc2023' ? p23_cache : ph_cache;
            return parseFloat(val.replace(/\./g, '').replace(/[^\d]/g, '')) || 0; 
        }

        function formatAndCalc(input) { 
            let v = input.value.replace(/\D/g, ""); 
            if (v !== "") input.value = "$ " + new Intl.NumberFormat('es-AR').format(v); 
            calculate(); if(activeSourceKey) initView(); 
        }
        
        function handlePresetChange() { 
            const k = document.getElementById('presetIncome').value, n = document.getElementById('incomeNote'), i23 = document.getElementById('inc2023'), ih = document.getElementById('incHoy');
            if(k !== "custom") {
                p23_cache = presets[k].v23; ph_cache = presets[k].vh;
                i23.value = "Ingreso oficial"; ih.value = "Ingreso oficial";
                i23.readOnly = true; ih.readOnly = true; n.classList.remove('opacity-0');
                if(k === "municipal") n.innerText = "Fuente: Paritarias Festram"; 
                else if(k === "comercio") n.innerText = "Fuente: CUEC"; 
                else if(k === "docente") n.innerText = "Fuente: Paritaria docente"; 
                else n.innerText = "";
            } else { 
                p23_cache = 0; ph_cache = 0; i23.value = ""; ih.value = ""; i23.readOnly = false; ih.readOnly = false; n.classList.add('opacity-0'); 
            }
            calculate(); if(activeSourceKey) initView();
        }

        function activateSource(k) { 
            const v = document.getElementById('productsView'); 
            if(activeSourceKey === k) { v.classList.add('hidden'); activeSourceKey = null; calculate(); return; } 
            activeSourceKey = k; v.classList.remove('hidden'); activeTabIdx = 0; initView(); 
            document.getElementById(`check-ipec`).classList.toggle('hidden', k !== 'ipec');
            document.getElementById(`check-alvear`).classList.toggle('hidden', k !== 'alvear');
        }

        function calculate() {
            const i23 = getVal('inc2023'), iH = getVal('incHoy');
            const hasData = i23 > 0 && iH > 0;
            ['ipec', 'alvear'].forEach(k => {
                const d = k === 'ipec' ? dataIPEC : dataAlvear;
                let s23 = 0, sh = 0, canBuyAny = false;
                d.forEach(g => g.items.forEach(p => { s23 += p.p23; sh += p.ph; if(i23 >= p.p23 || iH >= p.ph) canBuyAny = true; }));
                const el = document.getElementById(`dash-${k}`);
                if (hasData && canBuyAny) { 
                    const r = (((iH/sh)/(i23/s23))-1)*100; el.innerText = (r > 0 ? "+" : "") + r.toFixed(1) + "%"; el.className = `text-xl font-black ${r < 0 ? 'text-red-600' : 'text-green-600'}`; 
                } else el.innerText = "--%";
            });
            if(!activeSourceKey) return;
            const data = activeSourceKey === 'ipec' ? dataIPEC : dataAlvear;
            let t23 = 0, tH = 0, count = 0;
            data.forEach((group, gIdx) => {
                let gr23 = 0, grH = 0, grCount = 0;
                group.items.forEach((p, pIdx) => {
                    const pid = `${activeSourceKey}-${gIdx}-${pIdx}`;
                    const isChecked = selections[pid] === true || (!selectionMode && selections[pid] === undefined);
                    if(isChecked && (i23 >= p.p23 || iH >= p.ph)) { t23 += p.p23; tH += p.ph; count++; gr23 += p.p23; grH += p.ph; grCount++; }
                });
                const gV = (hasData && grCount > 0) ? (((iH/grH)/(i23/gr23))-1)*100 : null;
                document.querySelectorAll(`[data-g="${gIdx}"].res-group-v, [data-tab-v="${gIdx}"]`).forEach(b => { b.innerText = gV !== null ? (gV > 0 ? "+" : "") + gV.toFixed(1) + "%" : "--%"; b.className = `font-black ${gV < 0 ? 'text-red-600' : 'text-green-600'}`; });
            });
            const bar = document.getElementById('stickyBar');
            if (hasData && count > 0) { 
                const tot = (((iH/tH)/(i23/t23))-1)*100; bar.classList.remove('hidden'); document.getElementById('barPercent').innerText = (tot>0?"+":"")+tot.toFixed(1)+"%"; bar.className = `sticky-result-bar ${tot < 0 ? 'bg-loss' : 'bg-gain'}`; 
            } else bar.classList.add('hidden');
        }

        function initView() {
            if(!activeSourceKey) return;
            const data = activeSourceKey === 'ipec' ? dataIPEC : dataAlvear;
            const content = document.getElementById('dynamicContent'), tabsCont = document.getElementById('pcTabs'), i23 = getVal('inc2023'), iH = getVal('incHoy');
            content.innerHTML = ""; tabsCont.innerHTML = "";
            data.forEach((g, idx) => { tabsCont.innerHTML += `<div class="flex items-center bg-slate-50 border rounded-lg px-2"><button onclick="changeTab(${idx})" class="tab-btn ${activeTabIdx === idx ? 'active' : ''}">${g.cat} <span class="tab-v-badge" data-tab-v="${idx}">--%</span></button></div>`; });
            let tableHtml = `<table class="w-full text-sm desktop-table border rounded-xl overflow-hidden mt-4"><thead class="bg-slate-800 text-white uppercase text-[10px]"><tr><th class="p-4 text-left">Producto</th><th class="p-4 text-center">En 2023 comprabas</th><th class="p-4 text-center">Hoy comprás</th><th class="p-4 text-center">Variación</th></tr></thead><tbody>`;
            data[activeTabIdx].items.forEach((p, pIdx) => {
                const isChecked = true, hasUnits = (i23 >= p.p23 && iH >= p.ph);
                let vStr = "--%", u23Str = "-", uhStr = "-", vClass = "text-slate-300";
                if (hasUnits && i23 > 0 && iH > 0) { const v = (((iH/p.ph)/(i23/p.p23))-1)*100; vStr = (v>0?"+":"")+v.toFixed(1)+"%"; u23Str = (i23/p.p23).toFixed(1); uhStr = (iH/p.ph).toFixed(1); vClass = v < 0 ? "text-red-600" : "text-green-600"; }
                tableHtml += `<tr class="border-b"><td class="p-4 font-bold text-slate-700">${p.n}<div class="text-[9px] text-slate-400 font-bold mt-1 uppercase leading-none">Precio Ref: $${new Intl.NumberFormat('es-AR').format(p.p23)} / $${new Intl.NumberFormat('es-AR').format(p.ph)}</div></td><td class="p-4 text-center font-black">${u23Str}</td><td class="p-4 text-center font-black">${uhStr}</td><td class="p-4 text-center font-black text-xl ${vClass}">${vStr}</td></tr>`;
            });
            content.innerHTML = tableHtml + "</tbody></table>";
            calculate();
        }
        function changeTab(idx) { activeTabIdx = idx; initView(); }
    </script>
</body>
</html>
