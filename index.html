<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Poder Adquisitivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ESTRUCTURA PC */
        @media (min-width: 769px) {
            .container-main { max-width: 1100px; margin: 40px auto; }
            .panel-control { display: grid; grid-template-cols: 1fr 1fr; gap: 2rem; }
            .desktop-only { display: block; }
            .mobile-only { display: none; }
        }

        /* ESTRUCTURA MÓVIL */
        @media (max-width: 768px) {
            .desktop-only { display: none; }
            .mobile-only { display: block; }
            .category-block { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
            .prod-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        }

        .sticky-result-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .bg-loss { background: #dc2626; color: white; }
        .bg-gain { background: #16a34a; color: white; }
        .hidden-detail { display: none; }
    </style>
</head>
<body class="bg-slate-100 pb-40">

    <div class="container-main bg-white shadow-2xl md:rounded-2xl border-t-8 border-blue-900 overflow-hidden">
        
        <div class="bg-blue-900 p-6 text-white text-center">
            <h1 class="text-3xl font-black italic uppercase italic">¿CUÁNTO PERDIMOS?</h1>
            <p class="text-sm mt-2 opacity-90 font-medium">Comparamos la variación de los precios en supermercados con los ingresos</p>
        </div>

        <div class="p-4 md:p-10">
            <div class="panel-control mb-10 p-6 bg-slate-50 rounded-xl border border-slate-200">
                
                <div class="border-b md:border-b-0 md:border-r border-slate-300 pb-6 md:pb-0 md:pr-8">
                    <label class="block text-xs font-black text-blue-900 uppercase mb-3">Ingreso de referencia:</label>
                    <select id="presetIncome" class="w-full p-3 bg-white border-2 border-slate-300 rounded-lg font-bold mb-4" onchange="updateIncome()">
                        <option value="custom">CARGA MANUAL</option>
                        <option value="smvm">Salario Mínimo (SMVM)</option>
                        <option value="jubilacion">Jubilación Mínima</option>
                        <option value="municipal">Mínimo Garantizado Municipal</option>
                        <option value="comercio">Salario Comercio</option>
                        <option value="docente">Salario Docente</option>
                    </select>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Nov 2023</span>
                            <input type="text" id="inc2023" placeholder="$ pesos" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="calculate()">
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Hoy</span>
                            <input type="text" id="incHoy" placeholder="$ pesos" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div class="pt-6 md:pt-0 md:pl-8">
                    <label class="block text-xs font-black text-blue-900 uppercase mb-3">Canasta de precios:</label>
                    <div class="desktop-only">
                        <select id="priceSourcePC" class="w-full p-3 bg-white border-2 border-blue-900 rounded-lg font-black text-blue-900" onchange="renderTable()">
                            <option value="ipec">1. IPEC (Promedio Provincial)</option>
                            <option value="alvear">2. ALVEAR (Santa Fe)</option>
                            <option value="coto">3. COTO (Santa Fe)</option>
                        </select>
                        <div class="flex justify-between mt-4">
                            <button onclick="toggleAll(true)" class="text-[10px] font-bold text-blue-900 uppercase underline">Seleccionar todos</button>
                            <button onclick="toggleAll(false)" class="text-[10px] font-bold text-slate-400 uppercase underline">Limpiar</button>
                        </div>
                    </div>

                    <div class="mobile-only space-y-3">
                        <button onclick="toggleMobileDetail('ipec')" class="w-full p-4 bg-white border-2 border-blue-900 rounded-xl text-left">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-black text-blue-900 uppercase">1. IPEC</span>
                                <span id="dash-ipec" class="text-xl font-black text-red-600">--%</span>
                            </div>
                        </button>
                        <div id="detail-ipec" class="hidden-detail bg-white border rounded-lg p-2 mb-4"></div>

                        <button onclick="toggleMobileDetail('alvear')" class="w-full p-4 bg-white border-2 border-orange-500 rounded-xl text-left">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-black text-orange-600 uppercase">2. ALVEAR</span>
                                <span id="dash-alvear" class="text-xl font-black text-red-600">--%</span>
                            </div>
                        </button>
                        <div id="detail-alvear" class="hidden-detail bg-white border rounded-lg p-2 mb-4"></div>

                        <button onclick="toggleMobileDetail('coto')" class="w-full p-4 bg-white border-2 border-red-600 rounded-xl text-left">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-black text-red-600 uppercase">3. COTO</span>
                                <span id="dash-coto" class="text-xl font-black text-red-600">--%</span>
                            </div>
                        </button>
                        <div id="detail-coto" class="hidden-detail bg-white border rounded-lg p-2 mb-4"></div>
                    </div>
                </div>
            </div>

            <div class="desktop-only border rounded-xl overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-slate-800 text-white uppercase text-[10px]">
                        <tr>
                            <th class="p-4 w-20 text-center">Elegir</th>
                            <th class="p-4 text-left">Producto / Rubro</th>
                            <th class="p-4 text-center">Comprabas (2023)</th>
                            <th class="p-4 text-center">Comprás (Hoy)</th>
                            <th class="p-4 text-center">Variación</th>
                        </tr>
                    </thead>
                    <tbody id="pcTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="stickyBar" class="sticky-result-bar hidden">
        <div class="text-xs font-black uppercase italic" id="barLabel">Pérdida de poder adquisitivo</div>
        <div id="barPercent" class="text-4xl font-black italic tracking-tighter">0%</div>
    </div>

    <script>
        const dataIPEC = [
            {cat:"Carnicería",items:[{name:"Asado (Kg.)",p23:4116.28,pH:22305.00},{name:"Carne picada especial (Kg.)",p23:3674.89,pH:17076.20},{name:"Paleta (Kg.)",p23:3759.50,pH:19063.86},{name:"Cuadril (Kg.)",p23:4526.12,pH:22569.99},{name:"Nalga (Kg.)",p23:4429.40,pH:22524.60},{name:"Hígado (Kg.)",p23:1097.16,pH:5542.88},{name:"Pollo entero (Kg.)",p23:1417.83,pH:5279.56}]},
            {cat:"Almacén",items:[{name:"Arroz blanco (Kg.)",p23:1068.42,pH:1858.11},{name:"Harina de trigo (Kg.)",p23:402.46,pH:951.40},{name:"Fideos Secos (500 g.)",p23:642.99,pH:1471.06},{name:"Aceite de girasol (1,5 L.)",p23:1495.50,pH:6541.07},{name:"Azúcar (Kg.)",p23:1083.62,pH:1435.80},{name:"Yerba mate (500 g.)",p23:1181.03,pH:2359.58}]}
            // ... resto de productos
        ];
        
        // Simulación abreviada de las otras canastas por espacio, pero con la misma estructura
        const dataAlvear = [{cat:"General Alvear",items:[{name:"Pollo Las Camelias",p23:1299,pH:6199},{name:"Nalga ternera",p23:4290,pH:26990},{name:"Manteca tonadita",p23:599,pH:3199}]}];
        const dataCoto = [{cat:"General Coto",items:[{name:"Leche Tres Niñas",p23:479,pH:1890},{name:"Cuadril novillito 1K",p23:3099,pH:17699},{name:"Queso cremoso",p23:2099,pH:10999}]}];

        const presets = {
            smvm: { v23: 156000, vH: 363000 },
            jubilacion: { v23: 160713, vH: 463174 },
            municipal: { v23: 246008, vH: 1065000 },
            comercio: { v23: 332959, vH: 1095562 },
            docente: { v23: 269522, vH: 1037205 }
        };

        function cleanNum(id) {
            let val = document.getElementById(id).value;
            return parseFloat(val.replace(/\$/g, '').replace(/\./g, '').replace(',', '.')) || 0;
        }

        function updateIncome() {
            const s = document.getElementById('presetIncome').value;
            // No mostramos los montos, quedan vacíos para carga manual
            document.getElementById('inc2023').value = "";
            document.getElementById('incHoy').value = "";
            calculate();
        }

        function renderTable() {
            const src = document.getElementById('priceSourcePC').value;
            const data = src === 'alvear' ? dataAlvear : (src === 'coto' ? dataCoto : dataIPEC);
            const body = document.getElementById('pcTableBody');
            body.innerHTML = "";

            data.forEach((group, gIdx) => {
                // Fila de Rubro
                body.innerHTML += `
                    <tr class="bg-slate-100 border-y-2 border-slate-200">
                        <td class="p-2 text-center">
                            <input type="checkbox" checked class="w-4 h-4 group-check" data-group="${gIdx}" onchange="toggleGroup(${gIdx}, this.checked)">
                        </td>
                        <td colspan="4" class="p-2 font-black text-blue-900 uppercase text-xs tracking-widest">${group.cat}</td>
                    </tr>`;
                
                group.items.forEach(p => {
                    body.innerHTML += `
                        <tr class="border-b hover:bg-slate-50 transition">
                            <td class="p-3 text-center">
                                <input type="checkbox" checked class="p-check w-5 h-5" data-p23="${p.p23}" data-ph="${p.pH}" data-group="${gIdx}" onchange="calculate()">
                            </td>
                            <td class="p-3 font-bold text-slate-700">${p.name}</td>
                            <td class="p-3 text-center res-23 font-medium text-slate-500">-</td>
                            <td class="p-3 text-center res-h font-medium text-slate-500">-</td>
                            <td class="p-3 text-center res-v font-black text-lg">-</td>
                        </tr>`;
                });
            });
            calculate();
        }

        function calculate() {
            const s = document.getElementById('presetIncome').value;
            let i23 = cleanNum('inc2023');
            let iH = cleanNum('incHoy');

            // Si hay preset y los campos están vacíos, usamos el preset interno
            if (s !== "custom" && i23 === 0) i23 = presets[s].v23;
            if (s !== "custom" && iH === 0) iH = presets[s].vH;

            // Cálculos para Dashboard Móvil
            ['ipec', 'alvear', 'coto'].forEach(key => {
                const data = key === 'ipec' ? dataIPEC : (key === 'alvear' ? dataAlvear : dataCoto);
                let sum23 = 0, sumH = 0;
                data.forEach(g => g.items.forEach(p => { sum23 += p.p23; sumH += p.pH; }));
                const res = (((iH/sumH)/(i23/sum23))-1)*100;
                const el = document.getElementById(`dash-${key}`);
                if (el && i23 > 0) {
                    el.innerText = (res > 0 ? "+" : "") + res.toFixed(1) + "%";
                    el.className = `text-xl font-black ${res < 0 ? 'text-red-600' : 'text-green-600'}`;
                }
            });

            // Cálculos Tabla PC
            const rows = document.querySelectorAll('#pcTableBody tr:not(.bg-slate-100)');
            let t23 = 0, tH = 0, count = 0;

            rows.forEach(r => {
                const cb = r.querySelector('.p-check');
                if (cb.checked && i23 > 0) {
                    const p23 = parseFloat(cb.dataset.p23);
                    const ph = parseFloat(cb.dataset.ph);
                    const u23 = i23 / p23; const uh = iH / ph;
                    const v = ((uh/u23)-1)*100;
                    r.querySelector('.res-23').innerText = u23.toFixed(1) + " un.";
                    r.querySelector('.res-h').innerText = uh.toFixed(1) + " un.";
                    const rv = r.querySelector('.res-v');
                    rv.innerText = (v>0?"+":"")+v.toFixed(1)+"%";
                    rv.className = `p-3 text-center font-black text-lg ${v < 0 ? 'text-red-600' : 'text-green-600'}`;
                    t23 += p23; tH += ph; count++;
                }
            });

            const bar = document.getElementById('stickyBar');
            if (count > 0 && i23 > 0) {
                const total = (((iH/tH)/(i23/t23))-1)*100;
                bar.classList.remove('hidden');
                document.getElementById('barPercent').innerText = (total>0?"+":"")+total.toFixed(1)+"%";
                bar.className = `sticky-result-bar ${total < 0 ? 'bg-loss' : 'bg-gain'}`;
                document.getElementById('barLabel').innerText = total < 0 ? "Pérdida de poder adquisitivo" : "Mejora de poder adquisitivo";
            } else { bar.classList.add('hidden'); }
        }

        function toggleGroup(gIdx, val) {
            document.querySelectorAll(`.p-check[data-group="${gIdx}"]`).forEach(cb => cb.checked = val);
            calculate();
        }

        function toggleAll(val) {
            document.querySelectorAll('.p-check, .group-check').forEach(cb => cb.checked = val);
            calculate();
        }

        function toggleMobileDetail(key) {
            const detail = document.getElementById(`detail-${key}`);
            const isHidden = detail.style.display === 'none' || detail.style.display === '';
            document.querySelectorAll('.hidden-detail').forEach(d => d.style.display = 'none');
            if (isHidden) {
                detail.style.display = 'block';
                // Aquí podrías renderizar una versión mini de la tabla dentro del acordeón
                detail.innerHTML = `<p class="p-4 text-center text-xs font-bold text-slate-400 uppercase italic">Desglose de productos de ${key.toUpperCase()} activado en PC</p>`;
            }
        }

        renderTable();
        updateIncome();
    </script>
</body>
</html>
