<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Poder Adquisitivo - Comunidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para transformar la tabla en tarjetas en móviles */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr { 
                margin-bottom: 1rem;
                border: 2px solid #e5e7eb;
                border-radius: 0.5rem;
                overflow: hidden;
            }
            td { 
                border: none;
                position: relative;
                padding-left: 50% !important; 
                text-align: right !important;
                border-bottom: 1px solid #f3f4f6;
            }
            td:before { 
                position: absolute;
                left: 1rem;
                width: 45%; 
                padding-right: 10px; 
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                color: #6b7280;
                content: attr(data-label);
                text-transform: uppercase;
                font-size: 0.65rem;
            }
            td:last-child {
                border-bottom: 0;
                background-color: #f9fafb;
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-10 font-sans">
    <div class="max-w-5xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden">
        
        <div class="bg-blue-900 p-6">
            <h1 class="text-xl md:text-2xl font-bold text-white text-center italic uppercase">¿Cuánto perdimos?</h1>
            <p class="text-blue-200 text-center text-xs mt-1">Comparativa: Noviembre 2023 vs. Marzo 2026</p>
        </div>
        
        <div class="p-4 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 italic uppercase">1. Ingresos (Nov 2023 / Hoy)</label>
                        <select id="presetIncome" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none font-bold text-gray-600" onchange="updateIncome()">
                            <option value="custom">CARGA MANUAL</option>
                            <option value="smvm">SALARIO MÍNIMO (SMVM)</option>
                            <option value="jubilacion">JUBILACIÓN MÍNIMA</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Nov 2023</label>
                            <input type="number" id="income2023" placeholder="$ 0" class="w-full p-3 border-2 border-gray-100 rounded-lg focus:border-blue-500 outline-none font-bold text-lg" oninput="calculate()">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Hoy</label>
                            <input type="number" id="incomeHoy" placeholder="$ 0" class="w-full p-3 border-2 border-gray-100 rounded-lg focus:border-blue-500 outline-none font-bold text-lg" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 italic uppercase">2. Seleccionar Canasta</label>
                        <select id="priceSource" class="w-full p-3 border-2 border-blue-200 bg-blue-50 rounded-lg focus:border-blue-500 outline-none font-black text-blue-900" onchange="calculate()">
                            <option value="ipec">DATOS OFICIALES IPEC</option>
                            <option value="alvear">SUPERMERCADO ALVEAR</option>
                        </select>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button onclick="resetAll()" class="text-[10px] font-black text-gray-400 underline uppercase tracking-widest hover:text-red-500">
                            Reiniciar cálculo
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-10">
                <div class="max-h-[600px] overflow-y-auto md:border md:border-gray-200 md:rounded-lg">
                    <table class="w-full text-left">
                        <thead class="bg-gray-800 text-white sticky top-0">
                            <tr>
                                <th class="p-4 text-xs font-bold uppercase">Producto</th>
                                <th class="p-4 text-center text-xs font-bold uppercase">¿Cuánto comprabas en 2023?</th>
                                <th class="p-4 text-center text-xs font-bold uppercase">¿Cuánto comprás hoy?</th>
                                <th class="p-4 text-center text-xs font-bold uppercase">Variación</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable" class="divide-y divide-gray-100 text-gray-700 bg-white">
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="totalSummary" class="hidden">
                <div class="bg-red-600 rounded-xl p-1 shadow-xl">
                    <div class="bg-white p-6 rounded-lg flex flex-col md:flex-row items-center justify-between border-2 border-red-50">
                        <div class="text-center md:text-left mb-4 md:mb-0">
                            <h3 class="text-red-600 font-black text-2xl uppercase italic leading-none">Pérdida Total</h3>
                            <p class="text-gray-500 text-xs font-bold uppercase mt-1">De tu capacidad de compra</p>
                        </div>
                        <div id="totalPercentage" class="text-6xl md:text-7xl font-black text-red-600 tracking-tighter">
                            -0%
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dataIPEC = [
            { name: "Pan francés mignón (Kg.)", p2023: 913.97, pHoy: 3066.99 },
            { name: "Pan de mesa (390 g.)", p2023: 891.44, pHoy: 3993.77 },
            { name: "Galletitas dulces (150 g.)", p2023: 420.35, pHoy: 1464.71 },
            { name: "Galletitas de agua (250 g.)", p2023: 446.46, pHoy: 1415.21 },
            { name: "Harina de trigo común (Kg.)", p2023: 402.46, pHoy: 951.40 },
            { name: "Arroz blanco simple (Kg.)", p2023: 1068.42, pHoy: 1858.11 },
            { name: "Fideos Secos Guisero (500 g.)", p2023: 642.99, pHoy: 1471.06 },
            { name: "Asado (Kg.)", p2023: 4116.28, pHoy: 22305.00 },
            { name: "Carne picada especial (Kg.)", p2023: 3674.89, pHoy: 17076.20 },
            { name: "Paleta (Kg.)", p2023: 3759.50, pHoy: 19063.86 },
            { name: "Cuadril (Kg.)", p2023: 22569.99, pHoy: 22569.99 },
            { name: "Nalga (Kg.)", p2023: 4429.40, pHoy: 22524.60 },
            { name: "Hígado (Kg.)", p2023: 1097.16, pHoy: 5542.88 },
            { name: "Hamburguesas congeladas (4 u.)", p2023: 1609.24, pHoy: 6702.00 },
            { name: "Pollo entero (Kg.)", p2023: 1417.83, pHoy: 5279.56 },
            { name: "Filet de merluza fresco (Kg.)", p2023: 2994.08, pHoy: 12684.06 },
            { name: "Salchicha tipo Viena (6 u.)", p2023: 690.01, pHoy: 2562.66 },
            { name: "Jamón cocido (Kg.)", p2023: 5763.80, pHoy: 18956.52 },
            { name: "Salchichón (Kg.)", p2023: 3531.42, pHoy: 11963.98 },
            { name: "Salame (Kg.)", p2023: 6402.78, pHoy: 23098.17 },
            { name: "Aceite de girasol (1,5 L.)", p2023: 1495.50, pHoy: 6541.07 },
            { name: "Leche fresca entera (Sachet)", p2023: 560.48, pHoy: 1811.38 },
            { name: "Leche en polvo (800 g.)", p2023: 3513.07, pHoy: 12855.28 },
            { name: "Queso crema (280 g.)", p2023: 1213.22, pHoy: 4015.38 },
            { name: "Queso Sardo (Kg.)", p2023: 4982.96, pHoy: 21766.92 },
            { name: "Manteca (150 g.)", p2023: 792.13, pHoy: 3048.66 },
            { name: "Yogur firme (195 cc.)", p2023: 430.21, pHoy: 1780.65 },
            { name: "Dulce de leche (450 g.)", p2023: 1039.08, pHoy: 3571.45 },
            { name: "Huevos de gallina (12 u.)", p2023: 1196.71, pHoy: 3599.42 },
            { name: "Manzana deliciosa (Kg.)", p2023: 1084.17, pHoy: 4315.55 },
            { name: "Naranja (Kg.)", p2023: 562.89, pHoy: 2070.54 },
            { name: "Banana (Kg.)", p2023: 1281.06, pHoy: 3015.44 },
            { name: "Papa (Kg.)", p2023: 579.67, pHoy: 1232.51 },
            { name: "Cebolla (Kg.)", p2023: 358.53, pHoy: 1011.09 },
            { name: "Lechuga (Kg.)", p2023: 725.25, pHoy: 4427.59 },
            { name: "Tomate redondo (Kg.)", p2023: 1387.50, pHoy: 2419.70 },
            { name: "Tomate en conserva (230 g.)", p2023: 418.04, pHoy: 1301.98 },
            { name: "Lentejas secas (400 g.)", p2023: 813.91, pHoy: 1727.29 },
            { name: "Azúcar (Kg.)", p2023: 1083.62, pHoy: 1435.80 },
            { name: "Sal fina (500 g.)", p2023: 318.53, pHoy: 1355.67 },
            { name: "Gaseosa cola (1,5 L.)", p2023: 955.46, pHoy: 3807.16 },
            { name: "Agua sin Gas (1,5 L.)", p2023: 379.88, pHoy: 1899.67 },
            { name: "Soda sifón (2 L.)", p2023: 551.25, pHoy: 1590.26 },
            { name: "Cerveza en botella (L.)", p2023: 1100.56, pHoy: 3794.73 },
            { name: "Cerveza en lata (350 cc.)", p2023: 505.06, pHoy: 1589.57 },
            { name: "Vino común (L.)", p2023: 1094.44, pHoy: 2409.64 },
            { name: "Café molido (500 g.)", p2023: 2740.36, pHoy: 12325.65 },
            { name: "Yerba mate (500 g.)", p2023: 1181.03, pHoy: 2359.58 }
        ];

        const dataAlvear = [
            { name: "Pechito de Cerdo 1K", p2023: 2549, pHoy: 9490 },
            { name: "Chorizo Parrillero", p2023: 2790, pHoy: 13490 },
            { name: "Pollo Las Camelias", p2023: 1299, pHoy: 6199 },
            { name: "Marucha de ternera", p2023: 3149, pHoy: 18490 },
            { name: "Nalga de ternera", p2023: 4290, pHoy: 26990 },
            { name: "Picada ternera", p2023: 2699, pHoy: 12990 },
            { name: "Manteca tonadita", p2023: 599, pHoy: 3199 },
            { name: "Queso cremón", p2023: 2790, pHoy: 13999 },
            { name: "Harina Pureza pizzas", p2023: 495, pHoy: 1990 },
            { name: "Mayonesa Hellmans", p2023: 423, pHoy: 4999 },
            { name: "Jabón Skip 500cc", p2023: 2159, pHoy: 11999 },
            { name: "Ayudín 2L", p2023: 679, pHoy: 3499 },
            { name: "Toalla femenina x8", p2023: 299, pHoy: 3029 }
        ];

        const presets = {
            smvm: { v2023: 156000, vHoy: 363000 },
            jubilacion: { v2023: 160713, vHoy: 463174 }
        };

        function updateIncome() {
            const selected = document.getElementById('presetIncome').value;
            if (selected !== "custom") {
                document.getElementById('income2023').value = presets[selected].v2023;
                document.getElementById('incomeHoy').value = presets[selected].vHoy;
                calculate();
            }
        }

        function calculate() {
            const inc2023 = parseFloat(document.getElementById('income2023').value) || 0;
            const incHoy = parseFloat(document.getElementById('incomeHoy').value) || 0;
            const source = document.getElementById('priceSource').value;
            const products = source === 'ipec' ? dataIPEC : dataAlvear;
            
            const table = document.getElementById('resultsTable');
            const summaryDiv = document.getElementById('totalSummary');
            const totalText = document.getElementById('totalPercentage');
            
            table.innerHTML = "";
            let totalVariation = 0;

            if (inc2023 > 0 && incHoy > 0) {
                products.forEach(p => {
                    const u2023 = inc2023 / p.p2023;
                    const uHoy = incHoy / p.pHoy;
                    const diff = ((uHoy / u2023) - 1) * 100;
                    totalVariation += diff;

                    table.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b border-gray-100 transition-colors">
                            <td class="p-4 text-sm font-bold text-gray-800" data-label="Producto">${p.name}</td>
                            <td class="p-4 text-center text-gray-500 font-mono" data-label="¿Cuánto comprabas?">${u2023.toFixed(1)}</td>
                            <td class="p-4 text-center text-gray-700 font-mono font-bold" data-label="¿Cuánto comprás hoy?">${uHoy.toFixed(1)}</td>
                            <td class="p-4 text-center font-black ${diff < 0 ? 'text-red-600' : 'text-green-600'}" data-label="Variación">
                                ${diff.toFixed(1)}%
                            </td>
                        </tr>`;
                });

                const averageLoss = (totalVariation / products.length).toFixed(1);
                summaryDiv.classList.remove('hidden');
                totalText.innerText = `${averageLoss}%`;
            } else {
                summaryDiv.classList.add('hidden');
            }
        }

        function resetAll() {
            document.getElementById('presetIncome').value = "custom";
            document.getElementById('priceSource').value = "ipec";
            document.getElementById('income2023').value = "";
            document.getElementById('incomeHoy').value = "";
            document.getElementById('resultsTable').innerHTML = "";
            document.getElementById('totalSummary').classList.add('hidden');
        }
    </script>
</body>
</html>
