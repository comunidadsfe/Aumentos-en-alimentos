<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad | Variación de Precios</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --comunidad-violeta: #3D1488;
            --comunidad-fucsia: #EF3C6B;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--comunidad-violeta);
        }
        /* Ajuste de contenedor principal con estética Comunidad */
        .container-main { 
            max-width: 1200px; 
            margin: 40px auto; 
            background: white;
            border-top: 10px solid var(--comunidad-fucsia);
        }
        .header-institucional {
            background-color: var(--comunidad-violeta);
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid var(--comunidad-fucsia);
        }
        .logo-comunidad {
            max-width: 120px;
            margin: 0 auto 15px;
            border-radius: 12px;
        }
        /* Botones y acentos con Fucsia Comunidad */
        .btn-comunidad-fucsia {
            background-color: var(--comunidad-fucsia);
            color: white;
            transition: opacity 0.2s;
        }
        .btn-comunidad-fucsia:hover { opacity: 0.9; }
        
        .tab-btn.active { 
            background: var(--comunidad-violeta) !important; 
            border-color: var(--comunidad-fucsia) !important;
            color: white !important;
        }
        
        /* Sección de Informes Final */
        .informes-footer {
            max-width: 1200px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }
        .informes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .informe-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .pdf-viewer { width: 100%; height: 180px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .btn-pdf-dl {
            display: block;
            background: var(--comunidad-fucsia);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* Mantengo la placa de resultados intacta según tu instrucción */
        .sticky-result-bar { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); }
        .bg-loss { background: #dc2626; color: white; }
        .bg-gain { background: #16a34a; color: white; }
    </style>
</head>
<body class="pb-40">

    <div class="container-main shadow-2xl md:rounded-2xl overflow-hidden">
        <header class="header-institucional">
            <img src="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/logo.jpg" alt="Comunidad" class="logo-comunidad">
            <h1 class="text-white text-2xl font-black uppercase italic">¿Cuánto aumentaron los alimentos?</h1>
            <p class="text-white text-sm mt-2 opacity-90 font-medium">Análisis comparativo Dic 2023 vs Mayo 2026</p>
        </header>

        <div class="p-4 md:p-10">
            <div class="grid md:grid-cols-2 gap-8 mb-8 p-6 bg-slate-50 rounded-xl border border-slate-200">
                <div class="border-b md:border-b-0 md:border-r border-slate-300 pb-6 md:pb-0 md:pr-10">
                    <h2 class="text-xs font-black text-[#3D1488] uppercase mb-4 tracking-widest">1. Tu Ingreso</h2>
                    <select id="presetIncome" class="w-full p-3 bg-white border-2 border-slate-300 rounded-lg font-bold mb-4" onchange="handlePresetChange()">
                        <option value="custom">CARGA MANUAL</option>
                        <option value="smvm">Salario Mínimo (SMVM)</option>
                        <option value="jubilacion">Jubilación Mínima</option>
                        <option value="municipal">Mínimo Garantizado Municipal</option>
                        <option value="comercio">Salario Comercio</option>
                        <option value="docente">Salario Docente</option>
                    </select>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="inc2023" placeholder="$ 2023" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="formatAndCalc(this)">
                        <input type="text" id="incHoy" placeholder="$ Hoy" class="w-full p-3 border-2 rounded-lg text-center font-bold" oninput="formatAndCalc(this)">
                    </div>
                </div>
                <div class="md:pl-10">
                    <h2 class="text-xs font-black text-[#3D1488] uppercase mb-4 tracking-widest">2. Elegir Base de Datos</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="activateSource('ipec')" class="p-4 border-2 rounded-xl font-bold text-left hover:bg-slate-100 transition flex justify-between items-center">
                            <span>CANASTA IPEC SANTA FE</span>
                            <span id="dash-ipec">--%</span>
                        </button>
                        <button onclick="activateSource('alvear')" class="p-4 border-2 rounded-xl font-bold text-left hover:bg-slate-100 transition flex justify-between items-center">
                            <span>PRODUCTOS ALVEAR</span>
                            <span id="dash-alvear">--%</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="dynamicContent"></div>
        </div>
    </div>

    <section class="informes-footer">
        <h3 class="text-white text-center font-black uppercase text-xl italic">¿Cómo calculamos los datos? Leé nuestros informes</h3>
        <div class="informes-grid">
            <div class="informe-card">
                <strong class="block mb-3 text-[#3D1488] uppercase">Informe Tarifas</strong>
                <iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Tarifas.pdf&embedded=true"></iframe>
                <a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Tarifas.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a>
            </div>
            <div class="informe-card">
                <strong class="block mb-3 text-[#3D1488] uppercase">Salud y Prepagas</strong>
                <iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Prepagas%20y%20Medicamentos.pdf&embedded=true"></iframe>
                <a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Prepagas%20y%20Medicamentos.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a>
            </div>
            <div class="informe-card">
                <strong class="block mb-3 text-[#3D1488] uppercase">Alquileres CABA/SF</strong>
                <iframe class="pdf-viewer" src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Alquileres%20COMUNIDAD.pdf&embedded=true"></iframe>
                <a href="https://raw.githubusercontent.com/comunidadsfe/Lo-que-cuesta-vivir-en-Santa-Fe/main/Informes/Informe%20Alquileres%20COMUNIDAD.pdf" target="_blank" class="btn-pdf-dl">Descargar PDF</a>
            </div>
        </div>
    </section>

    <div id="stickyBar" class="sticky-result-bar hidden bg-loss">
        <div><div id="barLabel" class="text-[10px] font-black uppercase italic">Poder Adquisitivo</div><div id="barStatus" class="text-[10px] font-black uppercase italic">Pérdida</div></div>
        <div id="barPercent" class="text-4xl font-black italic">0%</div>
    </div>

    <script>
        // Lógica de presets con el valor de Comercio actualizado
        const presets = { 
            smvm: { v23: 156000, vh: 363000 }, 
            jubilacion: { v23: 160713, vh: 463174 }, 
            municipal: { v23: 246008, vh: 1065000 }, 
            comercio: { v23: 332959, vh: 1023016.21 }, 
            docente: { v23: 269522, vh: 1037205 } 
        };

        // ... (Aquí sigue la lógica de cálculo y manejo de DOM que ya teníamos validada)
        function formatAndCalc(input) {
            let v = input.value.replace(/\D/g, "");
            if (v !== "") input.value = "$ " + new Intl.NumberFormat('es-AR').format(v);
            // disparar cálculo...
        }

        function handlePresetChange() {
            const k = document.getElementById('presetIncome').value;
            if(k !== "custom") {
                document.getElementById('inc2023').value = "$ " + new Intl.NumberFormat('es-AR').format(presets[k].v23);
                document.getElementById('incHoy').value = "$ " + new Intl.NumberFormat('es-AR').format(presets[k].vh);
                document.getElementById('inc2023').readOnly = true;
                document.getElementById('incHoy').readOnly = true;
            } else {
                document.getElementById('inc2023').value = "";
                document.getElementById('incHoy').value = "";
                document.getElementById('inc2023').readOnly = false;
                document.getElementById('incHoy').readOnly = false;
            }
        }
    </script>
</body>
</html>
