<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Presupuesto Mensual</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 20px; color: #212529; }
        .container { max-width: 500px; margin: auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0d6efd; margin-bottom: 30px; font-weight: bold; }
        .field { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus, select:focus { border-color: #0d6efd; outline: none; }
        button { width: 100%; padding: 15px; background-color: #0d6efd; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #0b5ed7; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3); }
        
        .res-box { margin-top: 25px; padding: 20px; border-radius: 10px; display: none; text-align: center; }
        .pos { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .neg { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        
        .progress-container { width: 100%; background-color: #e9ecef; border-radius: 10px; margin: 15px 0; height: 18px; overflow: hidden; border: 1px solid #dee2e6; }
        .progress-bar { height: 100%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }
        
        .info-nota { font-size: 0.82em; color: #6c757d; margin-top: 5px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mi Calculadora</h2>

    <div class="field">
        <label>Tus Ingresos Mensuales ($)</label>
        <input type="number" id="ingreso" placeholder="Ingresa el monto total">
    </div>

    <div class="field">
        <label>Alquiler</label>
        <select id="alquiler">
            <option value="0">No alquilo / Propio</option>
            <option value="430000">1 ambiente</option>
            <option value="600000">2 ambientes</option>
            <option value="700000">3 ambientes</option>
            <option value="830000">4 ambientes</option>
        </select>
    </div>

    <div class="field">
        <label>Tarifas (Luz, Gas y Agua)</label>
        <select id="tarifas">
            <option value="141722.99">Con subsidios consumo medio</option>
            <option value="181337.99">Sin subsidios consumo medio</option>
            <option value="186886.99">Con subsidios consumo medio/alto</option>
            <option value="214289.99">Sin subsidios consumo medio/alto</option>
        </select>
        <div class="info-nota">* Basado en promedios según subsidios y consumo.</div>
    </div>

    <div class="field">
        <label>Cobertura Médica (Prepaga)</label>
        <select id="prepaga">
            <option value="0">No tengo / Obra Social</option>
            <option value="106000">Individual: Opción económica</option>
            <option value="121916">Individual: Opción media</option>
            <option value="144000">Individual: Opción alta</option>
            <option value="385454">Familiar: Opción económica</option>
            <option value="500463">Familiar: Opción media</option>
            <option value="764223">Familiar: Opción alta</option>
        </select>
    </div>

    <div class="field">
        <label>Litros de Nafta (al mes)</label>
        <input type="number" id="nafta" placeholder="Cantidad de litros">
        <div class="info-nota">* Costo por litro: $1.850</div>
    </div>

    <div class="field">
        <label>Boletos de Colectivo (al mes)</label>
        <input type="number" id="colectivo" placeholder="Cantidad de boletos">
        <div class="info-nota">* Costo por boleto: $1.720</div>
    </div>

    <button onclick="calcular()">Calcular Saldo y Porcentaje</button>

    <div id="resultado" class="res-box">
        <div id="monto-final" style="font-size: 1.6em; font-weight: bold;"></div>
        <div id="porcentaje-texto" style="margin: 10px 0; font-weight: 600;"></div>
        
        <div class="progress-container">
            <div id="barra" class="progress-bar"></div>
        </div>

        <div id="desglose" style="font-size: 0.9em; margin-top: 10px;"></div>
    </div>
</div>

<script>
    function calcular() {
        const PRECIO_NAFTA = 1850;
        const PRECIO_BOLETO = 1720;

        const ingreso = parseFloat(document.getElementById('ingreso').value) || 0;
        if (ingreso <= 0) {
            alert("Por favor, ingresa tu sueldo mensual.");
            return;
        }

        const vAlquiler = parseFloat(document.getElementById('alquiler').value);
        const vTarifas = parseFloat(document.getElementById('tarifas').value);
        const vPrepaga = parseFloat(document.getElementById('prepaga').value);
        const litrosNafta = parseFloat(document.getElementById('nafta').value) || 0;
        const cantBoletos = parseFloat(document.getElementById('colectivo').value) || 0;

        const totalTransporte = (litrosNafta * PRECIO_NAFTA) + (cantBoletos * PRECIO_BOLETO);
        const totalGastos = vAlquiler + vTarifas + vPrepaga + totalTransporte;
        const saldo = ingreso - totalGastos;
        
        // Lógica de porcentajes
        const porcentajeLibre = (saldo / ingreso) * 100;
        const porcentajeGastado = (totalGastos / ingreso) * 100;

        const resDiv = document.getElementById('resultado');
        const barra = document.getElementById('barra');
        resDiv.style.display = 'block';
        
        const formatoMoneda = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });

        if (saldo >= 0) {
            resDiv.className = 'res-box pos';
            barra.style.backgroundColor = '#198754';
            document.getElementById('monto-final').innerText = "Te quedan: " + formatoMoneda.format(saldo);
            document.getElementById('porcentaje-texto').innerText = "Dispones del " + porcentajeLibre.toFixed(1) + "% de tu sueldo.";
        } else {
            resDiv.className = 'res-box neg';
            barra.style.backgroundColor = '#dc3545';
            document.getElementById('monto-final').innerText = "Saldo en contra: " + formatoMoneda.format(Math.abs(saldo));
            document.getElementById('porcentaje-texto').innerText = "Tus gastos exceden tu sueldo en un " + Math.abs(porcentajeLibre).toFixed(1) + "%.";
        }

        // Animación de la barra
        let anchoVisual = Math.max(0, Math.min(100, porcentajeLibre));
        barra.style.width = anchoVisual + "%";
        
        document.getElementById('desglose').innerHTML = `
            <strong>Gastos totales:</strong> ${formatoMoneda.format(totalGastos)} <br>
            Representan el <strong>${porcentajeGastado.toFixed(1)}%</strong> de tus ingresos.
        `;
    }
</script>

</body>
</html>
