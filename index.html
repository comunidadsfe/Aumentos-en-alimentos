<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Poder Adquisitivo - Comunidad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { margin-bottom: 1rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; overflow: hidden; background: white; }
            td { border: none; position: relative; padding-left: 50% !important; text-align: right !important; border-bottom: 1px solid #f3f4f6; min-height: 3.5rem; display: flex; align-items: center; justify-content: flex-end; }
            td:before { position: absolute; left: 1rem; width: 45%; padding-right: 10px; white-space: nowrap; text-align: left; font-weight: bold; color: #6b7280; content: attr(data-label); text-transform: uppercase; font-size: 0.65rem; }
            td:last-child { border-bottom: 0; background-color: #f9fafb; }
            .checkbox-cell { justify-content: center !important; padding-left: 0 !important; background: #f0f7ff; }
            .checkbox-cell:before { content: "ELEGIR"; position: relative; width: auto; left: 0; margin-right: 10px; }
        }
        .sticky-header { position: sticky; top: 0; z-index: 20; }
        .category-row { background-color: #f3f4f6; font-weight: 900; text-transform: uppercase; font-size: 0.75rem; color: #374151; letter-spacing: 0.05em; }
    </style>
</head>
<body class="bg-gray-100 p-2 md:p-10 font-sans">
    <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden border-t-8 border-blue-900">
        
        <div class="bg-blue-900 p-8 text-white">
            <h1 class="text-3xl font-black uppercase tracking-tighter text-center italic">¿CUÁNTO PERDIMOS?</h1>
            <p class="text-blue-200 text-center text-sm mt-2 font-bold uppercase tracking-widest text-[10px]">Nov 2023 vs. Mar 2026</p>
        </div>
        
        <div class="p-4 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <div class="bg-gray-50 p-6 rounded-xl border-2 border-gray-100">
                    <label class="block text-sm font-black text-blue-900 uppercase mb-4 italic">1. Tus Ingresos</label>
                    <select id="presetIncome" class="w-full p-3 mb-4 bg-white border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none font-bold" onchange="updateIncome()">
                        <option value="custom">INGRESO MANUAL</option>
                        <option value="smvm">SALARIO MÍNIMO (SMVM)</option>
                        <option value="jubilacion">JUBILACIÓN MÍNIMA</option>
                    </select>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="income2023" placeholder="Nov 2023" class="p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none font-bold" oninput="calculateImpact()">
                        <input type="number" id="incomeHoy" placeholder="Hoy" class="p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 outline-none font-bold" oninput="calculateImpact()">
                    </div>
                </div>

                <div class="bg-blue-50 p-6 rounded-xl border-2 border-blue-100">
                    <label class="block text-sm font-black text-blue-900 uppercase mb-4 italic">2. Elegir Canasta</label>
                    <select id="priceSource" class="w-full p-3 mb-6 bg-white border-2 border-blue-300 rounded-lg focus:border-blue-600 outline-none font-black text-blue-900" onchange="renderTable()">
                        <option value="ipec">CANASTA OFICIAL IPEC (48 Prod.)</option>
                        <option value="alvear">CANASTA ALVEAR (Rubros)</option>
                        <option value="coto">CANASTA COTO (Rubros)</option>
                    </select>
                    <div class="flex gap-2">
                        <button onclick="selectAll(true)" class="flex-1 bg-blue-900 text-white text-[10px] font-black py-4 rounded-lg hover:bg-blue-800 uppercase">Calcular Todo</button>
                        <button onclick="selectAll(false)" class="flex-1 bg-gray-200 text-gray-600 text-[10px] font-black py-4 rounded-lg hover:bg-gray-300 uppercase">Limpiar</button>
                    </div>
                </div>
            </div>

            <div class="mb-10 overflow-hidden border-2 border-gray-200 rounded-xl shadow-sm">
                <div class="max-h-[550px] overflow-y-auto bg-gray-50">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky-header bg-gray-800 text-white text-[10px] uppercase font-black">
                            <tr>
                                <th class="p-4 w-12 text-center">🛒</th>
                                <th class="p-4">Producto</th>
                                <th class="p-4 text-center">¿En 2023 comprabas?</th>
                                <th class="p-4 text-center">¿Hoy comprás?</th>
                                <th class="p-4 text-center">Variación</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable" class="bg-white"></tbody>
                    </table>
                </div>
            </div>

            <div id="totalSummary" class="hidden">
                <div class="bg-red-600 p-6 rounded-xl shadow-2xl flex flex-col md:flex-row items-center justify-between text-white border-4 border-white">
                    <div class="text-center md:text-left mb-4 md:mb-0">
                        <h3 class="text-2xl font-black uppercase italic leading-none">Pérdida Total</h3>
                        <p class="text-[10px] font-bold uppercase mt-1 text-red-100 tracking-widest">Impacto en tu bolsillo</p>
                    </div>
                    <div id="totalPercentage" class="text-6xl md:text-8xl font-black tracking-tighter">-0%</div>
                </div>
            </div>
        </div>
    </div>

        const dataAlvear = [

            ]},

            ]},
            { cat: "Lácteos y Almacén", items: [
                { name: "Leche Tres Niñas (1L)", p2023: 479, pHoy: 1890 },
                { name: "Manteca 1er Premio (200g)", p2023: 649.9, pHoy: 3400 },
                { name: "Crema La Serenísima (330ml)", p2023: 719.9, pHoy: 4705 },
                { name: "Jardinera Tres Legumbres", p2023: 365.9, pHoy: 896.35 },
                { name: "Tostadas Riera (200g)", p2023: 654.9, pHoy: 1857 },
                { name: "Salsa Casera Knorr Pomarola", p2023: 228.9, pHoy: 1499 },
                { name: "Cerveza Heineken sin alcohol", p2023: 424, pHoy: 1500 }
            ]},
            { cat: "Limpieza e Higiene", items: [
                { name: "Skip Bioenzimas (800g)", p2023: 769.99, pHoy: 4420.99 },
                { name: "Papel Felpita 80mts", p2023: 1299.99, pHoy: 4295.87 }
            ]}
        ];

        const presets = {
            smvm: { v2023: 156000, vHoy: 363000 },
            jubilacion: { v2023: 160713, vHoy: 463174 }
        };

        function updateIncome() {
            const s = document.getElementById('presetIncome').value;
            if (s !== "custom") {
                document.getElementById('income2023').value = presets[s].v2023;
                document.getElementById('incomeHoy').value = presets[s].vHoy;
                calculateImpact();
            }
        }

        function renderTable() {
            const src = document.getElementById('priceSource').value;
            const data = src === 'ipec' ? dataIPEC : (src === 'alvear' ? dataAlvear : dataCoto);
            const body = document.getElementById('resultsTable');
            body.innerHTML = "";

            data.forEach(cat => {
                body.innerHTML += `<tr class="category-row"><td colspan="5" class="p-2 pl-4">${cat.cat}</td></tr>`;
                cat.items.forEach(p => {
                    body.innerHTML += `
                        <tr class="hover:bg-blue-50 transition border-b border-gray-100">
                            <td class="p-4 text-center checkbox-cell">
                                <input type="checkbox" class="w-5 h-5 prod-check" data-p2023="${p.p2023}" data-phoy="${p.pHoy}" onchange="calculateImpact()">
                            </td>
                            <td class="p-4 text-sm font-bold text-gray-800" data-label="Producto">${p.name}</td>
                            <td class="p-4 text-center font-mono text-gray-400 res-2023" data-label="¿En 2023 comprabas?">-</td>
                            <td class="p-4 text-center font-mono font-bold text-gray-600 res-hoy" data-label="¿Hoy comprás?">-</td>
                            <td class="p-4 text-center font-black text-xl res-diff" data-label="Variación">-</td>
                        </tr>`;
                });
            });
            document.getElementById('totalSummary').classList.add('hidden');
        }

        function calculateImpact() {
            const inc2023 = parseFloat(document.getElementById('income2023').value) || 0;
            const incHoy = parseFloat(document.getElementById('incomeHoy').value) || 0;
            
            const rows = document.querySelectorAll('#resultsTable tr:not(.category-row)');
            let totalVar = 0, count = 0;

            rows.forEach(row => {
                const check = row.querySelector('.prod-check');
                const p2023 = parseFloat(check.dataset.p2023);
                const pHoy = parseFloat(check.dataset.phoy);
                
                if (check.checked && inc2023 > 0 && incHoy > 0) {
                    const u2023 = inc2023 / p2023;
                    const uHoy = incHoy / pHoy;
                    const diff = ((uHoy / u2023) - 1) * 100;
                    
                    row.querySelector('.res-2023').innerText = u2023.toFixed(1);
                    row.querySelector('.res-hoy').innerText = uHoy.toFixed(1);
                    const diffCell = row.querySelector('.res-diff');
                    diffCell.innerText = `${diff.toFixed(1)}%`;
                    diffCell.className = `p-4 text-center font-black text-xl res-diff ${diff < 0 ? 'text-red-600' : 'text-green-600'}`;
                    
                    totalVar += diff;
                    count++;
                } else {
                    row.querySelectorAll('.res-2023, .res-hoy, .res-diff').forEach(c => c.innerText = "-");
                }
            });

            const summary = document.getElementById('totalSummary');
            if (count > 0) {
                summary.classList.remove('hidden');
                document.getElementById('totalPercentage').innerText = `${(totalVar / count).toFixed(1)}%`;
            } else {
                summary.classList.add('hidden');
            }
        }

        function selectAll(val) {
            document.querySelectorAll('.prod-check').forEach(c => c.checked = val);
            calculateImpact();
        }

        function resetAll() {
            document.getElementById('income2023').value = "";
            document.getElementById('incomeHoy').value = "";
            selectAll(false);
        }

        renderTable();
    </script>
</body>
</html>
